services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: seans-worker-qbit
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./qbit-config:/config
      - ${STAGING_HOST_DIR:-/mnt/staging}:/downloads
    restart: unless-stopped
    mem_limit: 1g

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: seans-worker-agent
    env_file: ../.env
    volumes:
      - ${STAGING_HOST_DIR:-/mnt/staging}:/staging
      - agent-state:/state
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - qbittorrent

volumes:
  agent-state: